name: Deploy OAuth worker

on:
  pull_request:
    paths:
      - oauth-worker/**
      - .github/workflows/oauth-worker.yml
  push:
    branches: [main]
    paths:
      - oauth-worker/**
      - .github/workflows/oauth-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test oauth-worker/test/*.test.js

  deploy:
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_WORKER_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: reviewstack-oauth-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy worker
        working-directory: oauth-worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify deployed worker
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 2 https://reviewstack-oauth.joao-9f7.workers.dev/health
