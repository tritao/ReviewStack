name: Test and deploy ReviewStack MCP worker

on:
  pull_request:
    paths:
      - mcp-worker/**
      - .github/workflows/mcp-worker.yml
  push:
    branches: [main]
    paths:
      - mcp-worker/**
      - .github/workflows/mcp-worker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-worker/package-lock.json
      - run: npm ci
        working-directory: mcp-worker
      - run: npm test
        working-directory: mcp-worker
      - run: npx wrangler deploy --dry-run
        working-directory: mcp-worker

  deploy:
    if: github.event_name != 'pull_request' && vars.CLOUDFLARE_WORKER_CI_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: reviewstack-mcp-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-worker/package-lock.json
      - run: npm ci
        working-directory: mcp-worker
      - name: Provision worker config and KV namespace
        id: provision
        working-directory: mcp-worker
        run: npm run provision:ci
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REVIEWSTACK_MCP_ALLOWED_REPOSITORIES: ${{ vars.REVIEWSTACK_MCP_ALLOWED_REPOSITORIES }}
          REVIEWSTACK_MCP_RESOURCE: ${{ vars.REVIEWSTACK_MCP_RESOURCE }}
          REVIEWSTACK_MCP_GITHUB_OAUTH_CALLBACK_URL: ${{ vars.REVIEWSTACK_MCP_GITHUB_OAUTH_CALLBACK_URL }}
          REVIEWSTACK_MCP_GITHUB_OAUTH_SCOPE: ${{ vars.REVIEWSTACK_MCP_GITHUB_OAUTH_SCOPE }}
          REVIEWSTACK_MCP_KV_TITLE: ${{ vars.REVIEWSTACK_MCP_KV_TITLE }}
      - name: Store GitHub OAuth credentials
        working-directory: mcp-worker
        env:
          WRANGLER_CONFIG: ${{ steps.provision.outputs.config_path }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CLIENT_ID: ${{ secrets.REVIEWSTACK_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.REVIEWSTACK_GITHUB_CLIENT_SECRET }}
        run: |
          test -n "$GITHUB_CLIENT_ID"
          test -n "$GITHUB_CLIENT_SECRET"
          printf '%s' "$GITHUB_CLIENT_ID" | npx wrangler secret put GITHUB_CLIENT_ID --config "$WRANGLER_CONFIG"
          printf '%s' "$GITHUB_CLIENT_SECRET" | npx wrangler secret put GITHUB_CLIENT_SECRET --config "$WRANGLER_CONFIG"
      - name: Deploy MCP worker
        working-directory: mcp-worker
        env:
          WRANGLER_CONFIG: ${{ steps.provision.outputs.config_path }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config "$WRANGLER_CONFIG"
      - name: Verify deployed worker
        if: vars.REVIEWSTACK_MCP_HEALTH_URL != ''
        env:
          HEALTH_URL: ${{ vars.REVIEWSTACK_MCP_HEALTH_URL }}
        run: curl --fail --silent --show-error "$HEALTH_URL"
