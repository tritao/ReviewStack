name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
        env:
          CI: true
      - run: yarn build
        env:
          PUBLIC_URL: /ReviewStack
          REACT_APP_GITHUB_OAUTH_CLIENT_ID: ${{ vars.REVIEWSTACK_OAUTH_CLIENT_ID }}
          REACT_APP_GITHUB_OAUTH_CALLBACK_URL: https://tritao.github.io/ReviewStack/auth/callback
          REACT_APP_GITHUB_OAUTH_TOKEN_ENDPOINT: ${{ vars.REVIEWSTACK_OAUTH_TOKEN_ENDPOINT }}
      - name: Add Pages routes
        run: yarn prepare-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reviewstack.dev/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn playwright install --with-deps chromium
      - name: Smoke-test deployed application
        run: yarn test:e2e
        env:
          REVIEWSTACK_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          REVIEWSTACK_E2E_GITHUB_TOKEN: ${{ secrets.REVIEWSTACK_E2E_GITHUB_TOKEN }}
