name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: npm ci --prefix mcp-worker
      - run: yarn lint
      - run: yarn test
        env:
          CI: true
      - run: yarn build
        env:
          PUBLIC_URL: /ReviewStack
          REACT_APP_GITHUB_OAUTH_CLIENT_ID: ${{ vars.REVIEWSTACK_OAUTH_CLIENT_ID }}
          REACT_APP_GITHUB_OAUTH_CALLBACK_URL: https://tritao.github.io/ReviewStack/auth/callback
          REACT_APP_GITHUB_OAUTH_TOKEN_ENDPOINT: ${{ vars.REVIEWSTACK_OAUTH_TOKEN_ENDPOINT }}
          REACT_APP_MCP_ENDPOINT: https://reviewstack-mcp.joao-9f7.workers.dev/mcp
          REACT_APP_CSP_CONNECT_SRC: >-
            https://api.github.com
            https://reviewstack-mcp.joao-9f7.workers.dev
            ${{ vars.REVIEWSTACK_OAUTH_TOKEN_ENDPOINT }}
      - run: yarn check:bundle-size
      - name: Add Pages routes
        run: yarn prepare-pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: reviewstack.dev/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
      - run: yarn playwright install --with-deps chromium
      - name: Smoke-test deployed application
        run: yarn test:e2e
        env:
          REVIEWSTACK_BASE_URL: ${{ needs.deploy.outputs.page_url }}
          REVIEWSTACK_E2E_GITHUB_TOKEN: ${{ github.token }}
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
